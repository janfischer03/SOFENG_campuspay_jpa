spring:
  config:
    # Datei liegt im Projektwurzelverzeichnis, neben pom.xml.
    # Der Hinweis [.properties] legt das Format der .env-Datei fest.
    import: "file:.env.dev[.properties]"
  datasource:
    url: "jdbc:mysql://localhost:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=
        false&serverTimezone=UTC"
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      # Lernphase: Tabellen bei jedem App-Start neu erstellen.
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
logging:
  level:
    org.hibernate.SQL: DEBUG
server:
  port: 8080